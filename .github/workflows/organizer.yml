name: Organize my sheet

on:
  schedule:
    - cron: "0 2 * * *"          # every day 02:00 UTC = 07:00 Pakistan time (GitHub may start it a few minutes late)
  workflow_dispatch:              # the "Run workflow" button
    inputs:
      dry_run:
        description: "yes = test only, writes nothing"
        default: "no"

concurrency:
  group: organizer                # two runs can never overlap and write twice
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python organizer.py
        env:
          # REQUIRED
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA: ${{ secrets.GOOGLE_SA }}
          # AI KEYS: add at least one. Several keys per provider can be comma separated.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # OPTIONAL: Figma
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE: ${{ vars.FIGMA_FILE }}          # the board link or its file key
          FIGMA_COMMENT: ${{ vars.FIGMA_COMMENT }}    # yes = post a short "sorted N items" comment with the sheet link
          # OPTIONAL: settings (all have safe defaults)
          INBOX_TAB: ${{ vars.INBOX_TAB }}            # name of the tab where you paste (default: Inbox, else first tab)
          TIMEZONE: ${{ vars.TIMEZONE }}              # default Asia/Karachi
          RUN_LIMIT: ${{ vars.RUN_LIMIT }}            # items per run, default 150
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN }}
