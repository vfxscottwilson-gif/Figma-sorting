name: Organize my sheet

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "yes = test only, writes nothing"
        default: "no"

concurrency:
  group: organizer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run organizer script
        run: python organizer.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA: ${{ secrets.GOOGLE_SA }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE: ${{ vars.FIGMA_FILE }}
          FIGMA_COMMENT: ${{ vars.FIGMA_COMMENT }}
          INBOX_TAB: ${{ vars.INBOX_TAB }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          RUN_LIMIT: ${{ vars.RUN_LIMIT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN }}
